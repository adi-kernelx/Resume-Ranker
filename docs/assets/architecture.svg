  <text x="798" y="622" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10px" fill="#8e91a1">PostgREST</text>
  <text x="1030" y="608" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10px" fill="#8e91a1">resume files</text>

  <rect x="348" y="636" width="884" height="140" rx="12" fill="#1d1f2c" stroke="#42475e" stroke-width="1"/>
  <text x="366" y="664" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17px" font-weight="700" fill="#e9e9ed">Supabase</text>
  <rect x="452" y="648" width="236" height="22" rx="11" fill="#9184d9" fill-opacity="0.12" stroke="#9184d9" stroke-opacity="0.45" stroke-width="1"/>
  <text x="570" y="663" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11px" font-weight="500" fill="#b4a8eb">Postgres · pgvector · Storage · Auth</text>

  <rect x="366" y="680" width="272" height="80" rx="8" fill="#222534" stroke="#2e3140" stroke-width="1"/>
  <text x="382" y="704" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13px" font-weight="600" fill="#e9e9ed">Auth</text>
  <text x="382" y="725" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11px" fill="#8e91a1">Email sign-in, JWT sessions</text>
  <text x="382" y="743" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11px" fill="#8e91a1">Verified on every API call</text>

  <rect x="654" y="680" width="272" height="80" rx="8" fill="#222534" stroke="#2e3140" stroke-width="1"/>
  <text x="670" y="704" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13px" font-weight="600" fill="#e9e9ed">PostgreSQL + pgvector</text>
  <text x="670" y="725" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11px" fill="#8e91a1">resumes · companies · rankings</text>
  <text x="670" y="743" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11px" fill="#8e91a1">jobs · ats_history · 384-d vectors</text>

  <rect x="942" y="680" width="272" height="80" rx="8" fill="#222534" stroke="#2e3140" stroke-width="1"/>
  <text x="958" y="704" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13px" font-weight="600" fill="#e9e9ed">Storage</text>
  <text x="958" y="725" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11px" fill="#8e91a1">Private resumes bucket</text>
  <text x="958" y="743" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11px" fill="#8e91a1">{user_id}/{uuid}.pdf</text>

